name: Verify platform
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: pets_test
          MYSQL_ROOT_PASSWORD: CiDbTest123!
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pCiDbTest123!"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:3306/pets_test?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      MYSQL_TEST_PASSWORD: CiDbTest123!
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend tests on H2 and MySQL
        run: mvn -B -ntp test
      - name: Frontend build and browser setup
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx playwright install --with-deps chromium
      - name: Start local backend for browser tests
        run: |
          mvn -B -ntp spring-boot:run -Dspring-boot.run.profiles=dev '-Dspring-boot.run.arguments=--spring.datasource.url=jdbc:h2:mem:browser;DB_CLOSE_DELAY=-1' > /tmp/pets-backend.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for attempt in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2)
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('Backend did not start')
          PY
      - name: Browser tests
        working-directory: frontend
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            target/surefire-reports
            frontend/test-results
            docs/screenshots
