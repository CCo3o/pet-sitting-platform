spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/pets?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:pets}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    locations: classpath:db/migration/mysql,classpath:db/migration/common
